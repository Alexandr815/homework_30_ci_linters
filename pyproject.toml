[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: unused imports, undefined names
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "B",   # flake8-bugbear: потенциальные баги
    "UP",  # pyupgrade: подсказки под современный Python
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # длину строки пусть в основном контролирует formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
mypy_path = "hw"
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[tool.pytest.ini_options]
python_files = [
    "test_*.py",
    "*_test.py",
]
addopts = "-ra"